; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno   ; plain Build/Upload only touches the main sketch

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library

; ESP-01 diagnostic. Build/upload with:  pio run -e espcheck -t upload
; Then open the Serial Monitor at 9600 baud.
[env:espcheck]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = -<*> +<../tools/espcheck.cpp>



; Unit tests for the pure watering rules, run on the PC. Needs a host C++ compiler
; (on Windows: pio pkg install -g -t platformio/toolchain-gccmingw32, then put
; ~/.platformio/packages/toolchain-gccmingw32/bin on PATH):
;   pio test -e native
[env:native]
platform = native
test_build_src = yes
build_flags = -std=gnu++11
build_src_filter = -<*> +<rules.cpp>
